DB_PASSWORD=myTestPass
JWT_SECRET=testttttt-secreeeeeeeeeeeeeeeeeeeeeeeeet-keeeeeeeey
# Run the project's real schema script against the fresh test database
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
# The scheduler opens and closes auctions every 10 seconds. That background
# activity would race with the tests' assertions, so it is switched off and the
# tests drive the lifecycle themselves.
bidforge.scheduler.enabled=false
# No demo accounts or sample auctions: each test creates exactly the data it
# needs, so tests stay independent of each other.
bidforge.seed.demo-data=false
spring.jpa.show-sql=false
logging.level.com.bidforge=INFO
