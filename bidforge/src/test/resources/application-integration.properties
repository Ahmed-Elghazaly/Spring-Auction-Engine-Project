# Extra settings used only by the integration tests
DB_PASSWORD=myTestPass
JWT_SECRET=testttttt-secreeeeeeeeeeeeeeeeeeeeeeeeet-keeeeeeeey
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
# The auction scheduler opens and closes auctions every 10 seconds
# During tests that background activity would race with the tests
# so it is switched off and the tests drive the lifecycle by itself
bidforge.scheduler.enabled=false
