spring.application.name=bidforge

# Optionally load a .env file from either the bidforge/ folder or the repository root.
# we can also supply the values as environment variables instead.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:bidforge}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null

bidforge.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# key must be at least 32 bytes
bidforge.jwt.secret=${JWT_SECRET}
bidforge.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
